services:
  # 1. Backend Express API Web Service
  - type: web
    name: mangal-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile --prod=false && pnpm --filter backend run db:generate && pnpm --filter backend run build
    startCommand: corepack enable && pnpm --filter backend run db:deploy && pnpm --filter backend start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mangal-postgres
          property: connectionString
      - key: REDIS_ENABLED
        value: "false"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: PROVIDER_MODE
        value: mock
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_PATH
        value: ./uploads

  # 2. Frontend Next.js Web App
  - type: web
    name: mangal-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile --prod=false && pnpm --filter frontend run build
    startCommand: corepack enable && pnpm --filter frontend start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: mangal-api
          property: host
      - key: BACKEND_URL
        fromService:
          type: web
          name: mangal-api
          property: host

databases:
  - name: mangal-postgres
    plan: free
    region: oregon
    databaseName: mangal_prod
    user: mangal
